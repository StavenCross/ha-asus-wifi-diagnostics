[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-asus-wifi-diagnostics"
version = "0.8.0"
description = "ASUS AiMesh 2.4 and 5 GHz radio diagnostics for Home Assistant"
requires-python = ">=3.13"
license = "MIT"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
